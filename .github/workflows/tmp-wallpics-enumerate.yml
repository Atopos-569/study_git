name: temp-wallpics-enumerate
on:
  push:
    branches: [tmp-wallpics-spongebob-20260816]
  workflow_dispatch:

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enumerate every SpongeBob live wallpaper page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p enum
          cat > enum.py <<'PY'
          import re, json, urllib.request, urllib.parse, time
          BASE='https://wallpics.app'
          CAT=BASE+'/live-wallpapers/cartoon-2274/cartoon-spongebob-square-pants'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode('utf-8','ignore')
          urls=[]; seen=set(); page=1
          while page<=100:
              url=CAT if page==1 else CAT+f'?page={page}'
              html=fetch(url)
              links=re.findall(r'href=["\'](/live-wallpaper/[^"\'#?]+)',html,re.I)
              fresh=0
              for x in links:
                  u=BASE+x.rstrip('/')
                  if u not in seen:
                      seen.add(u); urls.append(u); fresh+=1
              nxt=bool(re.search(r'<link[^>]+rel=["\']next["\'][^>]*>',html,re.I))
              print(f'page={page} links={len(links)} new={fresh} next={nxt}')
              open(f'enum/page-{page:03d}.txt','w').write('\n'.join(BASE+x for x in links))
              if not nxt: break
              page+=1; time.sleep(.15)
          open('enum/urls.txt','w').write('\n'.join(urls)+'\n')
          json.dump({'count':len(urls),'pages':page,'urls':urls},open('enum/summary.json','w'),indent=2)
          print('TOTAL',len(urls),'PAGES',page)
          PY
          python3 enum.py
          cat enum/summary.json | head -40
      - name: Upload enumeration
        uses: actions/upload-artifact@v4
        with:
          name: wallpics-spongebob-enumeration
          path: enum/
          retention-days: 1
